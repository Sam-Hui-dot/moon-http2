name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MOON_WORK: 'off'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Format, multi-target check, unit tests, and native build
        run: |
          moon version --all
          moon update
          moon fmt --check
          for target in wasm wasm-gc js native; do
            echo "=== target: $target ==="
            moon check --target "$target" --deny-warn .
            moon test --target "$target" --deny-warn .
          done
          moon build --target native --release --deny-warn cmd/main
      - name: Verify root library from an independent consumer module
        run: |
          WS="$RUNNER_TEMP/moon-http2-consumer"
          mkdir -p "$WS/library" "$WS/consumer"
          cp moon.mod moon.pkg error.mbt huffman.mbt hpack.mbt frame.mbt stream.mbt connection.mbt viz.mbt report.mbt "$WS/library/"
          printf 'members = ["library", "consumer"]\n' > "$WS/moon.work"
          cat > "$WS/consumer/moon.mod" << 'EOF'
          name = "consumer/http2-check"
          version = "0.1.0"

          import {
            "Sam-Hui-dot/moon-http2@0.1.0",
          }
          EOF
          cat > "$WS/consumer/moon.pkg" << 'EOF'
          import {
            "Sam-Hui-dot/moon-http2" @h2,
          }
          options(
            "is-main": true,
          )
          EOF
          cat > "$WS/consumer/main.mbt" << 'EOF'
          fn main raise {
            let enc = @h2.HpackEncoder::new()
            let dec = @h2.HpackDecoder::new()
            let wire = enc.encode([
              @h2.header_field(":method", "GET"),
              @h2.header_field(":path", "/"),
            ])
            let back = dec.decode(wire)
            guard back.length() == 2 else { abort("unexpected header count") }
            println("consumer: ok")
          }
          EOF
          MOON_WORK="" moon -C "$WS/consumer" run --target js --deny-warn .
          MOON_WORK="" moon -C "$WS/consumer" run --target wasm --deny-warn .
      - name: Build and smoke-test zero-upload browser workbench
        run: |
          python3 demo/build_web.py
      - name: Run 3 official external Oracles (http2jp/hpack-test-case + h2spec v2.6.0 + node:http2)
        run: |
          python3 demo/verify_h2.py
          cat demo/out/h2-oracle-summary.md >> "$GITHUB_STEP_SUMMARY"
